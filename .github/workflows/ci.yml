name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The landing page and docs are rendered in a real browser at eight widths in
  # both colour schemes, and every docs chapter is loaded at 320 and 1440. None
  # of what this catches is visible in a diff: a mermaid label declared at 16px
  # and drawn at 4.24px because the drawing was scaled to fit, a diagram blown up
  # 2.9x past the resolution of its own file, an in-chapter link to a heading id
  # that marked never generated, an element pushing the page sideways.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # The self-test runs FIRST and on its own step, so a gate that has stopped
      # discriminating stops the job before it can report a green. It breaks each
      # invariant on purpose and requires the check to notice.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs

  coverage:
    # Reports workspace coverage; does not gate the build on a percentage. An arbitrary threshold
    # rewards tests written to move the number rather than tests written to catch a bug — and the
    # gap this task exists to close (a 400-line renderer with zero tests) was invisible precisely
    # because nothing measured it, not because a threshold was set too low. So this job prints the
    # number, in the job summary where a human reads it on every PR, and stops there. If a future
    # contributor is tempted to "fix" the missing `fail-under`, this comment is the answer: don't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace | tee /tmp/coverage.txt
      - name: Publish to job summary
        run: |
          {
            echo "### Coverage (informational — no threshold, see workflow comment)"
            echo '```'
            cat /tmp/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tract-vector-drift:
    # The conformance vectors are vendored (crates/soko-node/tests/tract-vectors/), so the `test`
    # job above verifies Soko against them with no network and no second checkout — that is the
    # point of vendoring and it must stay true. This job checks the other direction, which a
    # vendored copy cannot check for itself: that the copy still matches what the spec publishes.
    #
    # The spec checkout is best-effort on purpose. If vul-os/kotva is unavailable, this job says so
    # and passes: nothing in this repository builds, tests or ships any less because a different
    # repository was unreachable (kotva/coordinator/CONTRACT.md — no shared thing is load-bearing).
    # Where the checkout does succeed, SOKO_REQUIRE_TRACT_VECTORS=1 makes a silent skip impossible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: soko }
      - uses: actions/checkout@v4
        continue-on-error: true
        with: { repository: vul-os/kotva, path: kotva }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: soko }
      - run: |
          if [ -d kotva/profiles/tract/conformance/vectors ]; then
            cd soko
            SOKO_REQUIRE_TRACT_VECTORS=1 cargo test -p soko-node --test conformance \
              vendored_corpus_matches_the_upstream_spec_checkout
          else
            echo "::warning::the TRACT spec repository could not be checked out, so the vendored vectors were NOT compared against upstream in this run. Soko's own conformance checks still ran in the test job above — they read the vendored copies."
          fi

  seam-has-no-dependencies:
    # The seam's whole purpose is that implementing it costs nothing. A dependency added here is
    # inherited by everyone who wires their own payment provider, so this is a CI gate rather than
    # a comment somebody will eventually ignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          lines=$(cargo tree -p soko-seam --edges normal | grep -c .)
          echo "cargo tree -p soko-seam -> $lines line(s)"
          test "$lines" -eq 1 || { echo "::error::soko-seam gained a dependency"; cargo tree -p soko-seam; exit 1; }
