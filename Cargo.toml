[workspace]
resolver = "2"
members = [
    "crates/soko-core",
    "crates/soko-seam",
]

# Crates land as their TRACT section is specified, not before. Adding an empty crate per
# section up front would claim coverage that does not exist; the workspace is meant to be
# readable as an honest statement of what is implemented.
#
# Planned, in the order the spec settles them:
#   soko-catalog      §2  product records, offers, variants, the product-identity ladder
#   soko-availability §3  stock, slots (RFC 5545), capacity, made-to-order
#   soko-order        §6,§7  buyer-side cart CRDT, sealed orders, the order state machine
#   soko-delivery     §8  rate cards, legs, consolidation, local route computation
#   soko-settle       §9  the payment seam over patala; escrow attestations
#   soko-trust        §10 purchase-attested reviews, local ranking
#   soko-jurisdiction §11 the four anchors, scope declarations, tax fields
#   soko-node             the node binary
#   soko-gateway          the storefront gateway (SEPARATE process — never shares an
#                         address space with identity keys; see TRACT §12)

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/vul-os/soko"
authors = ["VulOS"]

[workspace.dependencies]
# Substrate. Soko does not reimplement identity, feeds, blobs, or sync — it adopts the
# DMTAP substrate crates. Paths are placeholders until these are published; see BINDINGS.md
# in the dmtap repo for the one-core/many-bindings plan.
# dmtap-core        = { path = "../envoir/crates/dmtap-core" }
# dmtap-sync        = { path = "../envoir/crates/dmtap-sync" }

# Settlement. patala is a seam implementation, never a hard dependency: soko-seam names no
# payment provider anywhere in its traits (see crates/soko-seam).
# patala-core       = { path = "../../patala/patala-core" }

serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
