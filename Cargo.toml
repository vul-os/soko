[workspace]
resolver = "2"
members = [
    "crates/soko-seam",
    "crates/soko-core",
    "crates/soko-offer",
    "crates/soko-catalog",
    "crates/soko-order",
    "crates/soko-delivery",
    "crates/soko-settle",
    "crates/soko-trust",
    "crates/soko-jurisdiction",
    "crates/soko-erasure",
    "crates/soko-feed",
    "crates/soko-gateway",
    "crates/soko-node",
]

# Every crate covers one part of the protocol. They exist and compile; the depth behind each
# type varies by how far its TRACT section has been specified, and each crate's docs say so.
# Dependency direction is fixed: everything depends on soko-seam, soko-seam depends on nothing.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/vul-os/soko"
authors = ["VulOS"]

[workspace.dependencies]
# Substrate. Soko does not reimplement identity, feeds, blobs, or sync — it adopts the
# DMTAP substrate crates. Paths are placeholders until these are published; see BINDINGS.md
# in the dmtap repo for the one-core/many-bindings plan.
# dmtap-core        = { path = "../envoir/crates/dmtap-core" }
# dmtap-sync        = { path = "../envoir/crates/dmtap-sync" }

# Settlement. patala is a seam implementation, never a hard dependency: soko-seam names no
# payment provider anywhere in its traits (see crates/soko-seam).
# patala-core       = { path = "../../patala/patala-core" }

serde = { version = "1", features = ["derive"] }
# Signing and content addressing. TRACT §16.2 introduces neither — these are the primitives the
# substrate specifies (Ed25519, RFC 8032; BLAKE3), implemented here rather than invented.
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
ciborium = "0.2"
thiserror = "2"
unicode-normalization = "0.1"

# Dev-only. Property-based tests generate operation sequences no hand-picked case would think to
# try. Never add this under a crate's [dependencies] — only [dev-dependencies] — or it leaks into
# the normal dependency tree of every downstream consumer for no runtime benefit.
proptest = "1"

# Dev-only. Parses the TRACT conformance vectors' JSON for `soko-node`'s conformance test — the
# vectors are read as data, never linked as code (see `conformance/README.md`'s "implementation
# neutrality" rule), so a JSON parser is the only thing this pulls in. Same rule as `proptest`
# above: [dev-dependencies] only.
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
