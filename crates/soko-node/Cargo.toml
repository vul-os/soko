[package]
name = "soko-node"
description = "The Soko node: publishes a catalogue, receives sealed orders, computes routing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
soko-core = { path = "../soko-core" }
soko-catalog = { path = "../soko-catalog" }
soko-offer = { path = "../soko-offer" }
soko-delivery = { path = "../soko-delivery" }
soko-order = { path = "../soko-order" }
soko-settle = { path = "../soko-settle" }
soko-trust = { path = "../soko-trust" }
soko-jurisdiction = { path = "../soko-jurisdiction" }
soko-gateway = { path = "../soko-gateway" }

[dev-dependencies]
# Parses the TRACT conformance vector JSON in `tests/conformance.rs`. Never a normal dependency —
# see the note beside `serde_json` in the workspace `Cargo.toml`.
serde_json.workspace = true
# Digests the vendored TRACT vectors in `tests/tract-vectors/`, so an edited copy fails instead of
# quietly passing. Already the workspace's hash (soko-feed uses it for content addresses), so
# pinning the corpus adds no new dependency to anything — and none at all outside dev builds.
blake3.workspace = true
